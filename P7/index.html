<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facebook Clone</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f0f2f5;
    }
    .fb-header {
      background-color: #1877f2;
      color: white;
      padding: 10px 0;
    }
    .fb-logo {
      font-size: 32px;
      font-weight: bold;
    }
    .form-control {
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<!-- Header -->
<div class="fb-header">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="fb-logo">facebook</div>

    <form class="d-flex gap-2">
      <input type="text" class="form-control" placeholder="Email">
      <input type="password" class="form-control" placeholder="Password">
      <button class="btn btn-light btn-sm">Login</button>
    </form>
  </div>
</div>

<!-- Main Section -->
<div class="container mt-5">
  <div class="row">

    <!-- Left Side -->
    <div class="col-md-6">
      <h4>Facebook is useless without friends.<br>Make More Friends.</h4>
      <p class="mt-3">
        Facebook helps you connect and share with people in your life.
      </p>
      <img src="https://via.placeholder.com/400x200" class="img-fluid">
    </div>

    <!-- Right Side (Signup Form) -->
    <div class="col-md-6">
      <h2>Create an Account</h2>
      <p>It's free and always will be.</p>

      <form>
        <div class="row">
          <div class="col">
            <input type="text" class="form-control" placeholder="First name">
          </div>
          <div class="col">
            <input type="text" class="form-control" placeholder="Last name">
          </div>
        </div>

        <input type="email" class="form-control" placeholder="Email">
        <input type="email" class="form-control" placeholder="Re-enter email">
        <input type="password" class="form-control" placeholder="Password">

        <input type="date" class="form-control">

        <!-- Gender -->
        <div class="mt-2">
          <input type="radio" name="gender"> Male
          <input type="radio" name="gender" class="ms-3"> Female
        </div>

        <p class="mt-3" style="font-size: 12px;">
          By clicking create an account, you agree to our Terms.
        </p>

        <button class="btn btn-success">Signup</button>
      </form>
    </div>

  </div>
</div>

</body>
</html>
