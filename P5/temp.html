<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="navbar navbar-dark">
        <div class="container">
            <div class="nav-left">Mugs</div>
            <div class="nav-right">
                <div class="dropdown">
                    <button class="btn btn-outline-dark dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        Filter Category
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" onclick="displayCards('all')">All</a></li>
                        <li><a class="dropdown-item" onclick="displayCards('electric')">Electronics</a></li>
                        <li><a class="dropdown-item" onclick="displayCards('fashion')">Fashion</a></li>
                        <li><a class="dropdown-item" onclick="displayCards('home')">Home</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="container">
            <div class="row">
                <div class="col-lg-3 product">
                    <div class="card">
                        <img class="img-fluid" src="https://picsum.photos/seed/nature/800/600" alt="">
                        <div class="card-body">
                            <h1 class="card-title">Scooter</h1>
                            <p class="card-text">This is electric scooter</p>
                            <button class="btn btn-primary">button</button>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3 product">
                    <div class="card" data-category="home">
                        <img class="img-fluid" src="https://picsum.photos/seed/electric/800/600" alt="">
                        <div class="card-body">
                            <h1 class="card-title">Home</h1>
                            <p class="card-text">This is electric scooter</p>
                            <button class="btn btn-primary">button</button>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3 product">
                    <div class="card" data-category="electric">
                        <img class="img-fluid" src="https://picsum.photos/seed/water/800/600" alt="">
                        <div class="card-body">
                            <h1 class="card-title">Electric</h1>
                            <p class="card-text">This is electric scooter</p>
                            <button class="btn btn-primary" onclick="displayCards('electric');">button</button>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3 product">
                    <div class="card" data-category="fashion">
                        <img class="img-fluid" src="https://picsum.photos/seed/coding/800/600" alt="">
                        <div class="card-body">
                            <h1 class="card-title">Fashion</h1>
                            <p class="card-text">This is electric scooter</p>
                            <button class="btn btn-primary" onclick="displayCards('fashion')">button</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <script>
        function displayCards(category) {
            
            let products = document.querySelectorAll(".product");
            products.forEach(product => {
                if (category === 'all' || category === product.firstElementChild.dataset.category) {
                    product.style.display = "block";
                }
                else {
                    product.style.display = "none"
                }
            })
        }
    </script>
</body>

</html>
