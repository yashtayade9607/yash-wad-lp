        paginatedItems.forEach(products => {

                <td>${products.name}</td>

            </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    displayProducts(1);

    let page = 1;

    document.getElementById("next").addEventListener("click", () => {

    })

    document.getElementById("prev").addEventListener("click", () => {
        displayProducts(--page);
