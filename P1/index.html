<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .table-container {
            overflow-x: auto;
            background: white;
            padding: 10px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }

        img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .pagination {
            text-align: center;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .pagination button.active {
            background: #007bff;
        }

        .pagination button:hover {
            opacity: 0.8;
        }

        @media (max-width: 600px) {

            th,
            td {
                font-size: 14px;
            }

            img {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>

<body>

    <h1>Product Catalog</h1>

    <div class="table-container">
        <table id="productTable">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Product Name</th>
                    <th>Price (₹)</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="pagination" id="pagination"></div>

    <script>
        const products = [
            {
                name: "Wireless Headphones",
                price: "₹7,999",
                desc: "Noise-cancelling over-ear headphones.",
                img: "https://via.placeholder.com/100"
            },
            {
                name: "Smartwatch",
                price: "₹12,999",
                desc: "Fitness tracking smartwatch.",
                img: "https://via.placeholder.com/100"
            },
            {
                name: "Gaming Mouse",
                price: "₹2,499",
                desc: "Ergonomic gaming mouse.",
                img: "https://via.placeholder.com/100"
            },
            {
                name: "Gaming Mouse",
                price: "₹2,499",
                desc: "Ergonomic gaming mouse.",
                img: "https://via.placeholder.com/100"
            },
            {
                name: "Gaming Mouse",
                price: "₹2,499",
                desc: "Ergonomic gaming mouse.",
                img: "https://via.placeholder.com/100"
            },
            {
                name: "Laptop Stand",
                price: "₹1,999",
                desc: "Adjustable aluminium stand.",
                img: "https://via.placeholder.com/100"
            }
        ];

        const rowsPerPage = 1;
        let currentPage = 1;

        function displayProducts(page) {
            const tableBody = document.querySelector("#productTable tbody");
            tableBody.innerHTML = "";

            const start = (page - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedItems = products.slice(start, end);

            paginatedItems.forEach(product => {
                const row = `
                <tr>
                    <td><img src="${product.img}" alt="${product.name}"></td>
                    <td>${product.name}</td>
                    <td>${product.price}</td>
                    <td>${product.desc}</td>
                </tr>
            `;
                tableBody.innerHTML += row;
            });
        }

        function setupPagination() {
            const pagination = document.getElementById("pagination");
            pagination.innerHTML = "";

            const pageCount = Math.ceil(products.length / rowsPerPage);

            for (let i = 1; i <= pageCount; i++) {
                const btn = document.createElement("button");
                btn.innerText = i;

                if (i === currentPage) btn.classList.add("active");

                btn.addEventListener("click", () => {
                    currentPage = i;
                    displayProducts(currentPage);
                    setupPagination();
                });

                pagination.appendChild(btn);
            }
        }

        displayProducts(currentPage);
        setupPagination();
    </script>

</body>

</html>
