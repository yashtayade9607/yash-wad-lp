<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa
        }

        .box {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">
            <h3 class="text-center mb-3">Event Registration</h3>

            <form class="needs-validation" novalidate>

                <div class="form-floating mb-3">
                    <input class="form-control" placeholder="Name" required data-bs-toggle="tooltip"
                        title="Enter your name">
                    <label>Name</label>
                    <div class="invalid-feedback">Enter name</div>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" class="form-control" placeholder="Email" required data-bs-toggle="tooltip"
                        title="Valid email">
                    <label>Email</label>
                    <div class="invalid-feedback">Valid email required</div>
                </div>

                <div class="form-floating mb-3">
                    <input type="tel" pattern="[0-9]{10}" class="form-control" placeholder="Phone" required
                        data-bs-toggle="tooltip" title="10 digit number">
                    <label>Phone</label>
                    <div class="invalid-feedback">Enter 10 digits</div>
                </div>

                <div class="form-floating mb-3">
                    <select class="form-select" required data-bs-toggle="tooltip" title="Choose event">
                        <option value=""></option>
                        <option>Tech</option>
                        <option>Workshop</option>
                        <option>Seminar</option>
                    </select>
                    <label>Event</label>
                    <div class="invalid-feedback">Select event</div>
                </div>

                <div class="form-floating mb-3">
                    <input type="date" class="form-control" required data-bs-toggle="tooltip" title="Pick date">
                    <label>Date</label>
                    <div class="invalid-feedback">Select date</div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" required data-bs-toggle="tooltip"
                        title="Accept terms">
                    <label class="form-check-label">Agree terms</label>
                    <div class="invalid-feedback">Required</div>
                </div>

                <button class="btn btn-primary w-100">Register</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(t => new bootstrap.Tooltip(t));

        document.querySelector('form').onsubmit = e => {
            if (!e.target.checkValidity()) { e.preventDefault(); e.stopPropagation() }
            e.target.classList.add('was-validated');
        };

        // document.querySelector('form').onsubmit = function (e) {
        //     if (!this.checkValidity()) e.preventDefault();
        //     this.classList.add('was-validated');
        // };

        // document.querySelector('form').addEventListener('submit', function (e) {
        //     if (!this.checkValidity()) e.preventDefault();
        //     this.classList.add('was-validated');
        // });
    </script>

</body>

</html>
